// Nama tamu dari ?to=Nama: spasi di ujung dibuang, maksimal 60 karakter (di-escape saat ditampilkan).
// Nama yang lebih panjang dipotong di batas kata terakhir dan diberi "…" (hasil tetap ≤ 60 karakter);
// bila tidak ada spasi setelah karakter ke-30, dipotong keras di 59 karakter.
function clipName(name, max = 60) {
  const ch = [...name];
  if (ch.length <= max) return name;
  const head = ch.slice(0, max - 1);
  const at = /\s/.test(ch[max - 1]) ? max - 1 : head.map((c) => /\s/.test(c)).lastIndexOf(true);
  if (at < 30) return head.join("") + "…";
  return head.slice(0, at).join("").replace(/[\s.,;:!?&\/\-–—]+$/, "") + "…";
}

// Versi WebP ada di foto/webp/ dengan nama yang sama; foto sampul juga punya versi 480 px untuk HP.
function photoImg(demo, _width, eager, alt = "") {
  const base = demo.src.replace("../foto/", "../foto/webp/").replace(/\.jpg$/, "");
  const webp = base.endsWith("/cover")
    ? `<source type="image/webp" srcset="${base}-480.webp 480w, ${base}.webp 800w" sizes="(min-width: 600px) 280px, 62vw">`
    : `<source type="image/webp" srcset="${base}.webp">`;
  return `<picture>${webp}<img src="${demo.src}" data-hd="${demo.src.replace("../foto/", "../foto/hd/")}" alt="${esc(alt)}" ${eager ? 'fetchpriority="high"' : 'loading="lazy"'} decoding="async"${demo.pos ? ` style="object-position:${demo.pos}"` : ""}></picture>`;
}

const fontSize = (n, min = "body") => `max(var(--min-${min},0px),${s(n)})`;

function textStyle(st, min) {
  return `font-family:'f-${st.fontId}';font-size:${fontSize(st.fontSize, min)};color:${st.color};text-align:${st.align};line-height:${st.lineHeight};letter-spacing:${s(st.letterSpacing)};`;
}

function tiptapHtml(doc) {
  return doc.content.map((block) => {
    const inner = (block.content ?? []).map((n) => {
      if (n.type === "hardBreak") return "<br>";
      let h = esc(fill(n.text));
      for (const m of n.marks ?? []) {
        if (m.type === "bold") h = `<strong>${h}</strong>`;
        if (m.type === "italic") h = `<em>${h}</em>`;
        if (m.type === "underline") h = `<u>${h}</u>`;
        if (m.type === "textStyle") h = `<span style="color:${m.attrs.color}">${h}</span>`;
      }
      return h;
    }).join("");
    return `<p>${inner || "&nbsp;"}</p>`;
  }).join("");
}

// Google Calendar: dari mulai akad sampai selesai resepsi.
function calendarUrl() {
  const evs = Object.values(EVENT.events).sort((a, b) => a.startsAt.localeCompare(b.startsAt));
  const first = evs[0], last = evs[evs.length - 1];
  const z = (iso) => new Date(iso).toISOString().replace(/[-:]|\.\d{3}/g, "");
  const q = new URLSearchParams({
    action: "TEMPLATE",
    text: `Pernikahan ${EVENT.bride.name} & ${EVENT.groom.name}`,
    dates: `${z(first.startsAt)}/${z(last.endsAt ?? last.startsAt)}`,
    details: `${Object.entries(EVENT.events).map(([k, ev]) => `${k[0].toUpperCase()}${k.slice(1)} ${fmtTime(ev.startsAt, ev.timezone)} ${TZ_ABBR[ev.timezone] ?? ""} di ${ev.venue}.`).join(" ")} ${location.href.split("?")[0]}`,
    // Lokasi = tempat acara pertama (akad), karena entri kalender dimulai dari sana.
    location: `${first.venue}, ${first.address}`,
  });
  return `https://calendar.google.com/calendar/render?${q}`;
}

function renderElement(e) {
  const node = document.createElement(e.action?.kind === "add-to-calendar" ? "a" : "div");
  node.className = "el";
  node.id = `e-${e.id}`;
  let css = `left:${s(e.x)};top:${s(e.y)};width:${s(e.width)};height:${s(e.height)};--o:${e.opacity};transform:rotate(${e.rotation}deg) scale(${e.flip[0]},${e.flip[1]});`;
  switch (e.type) {
    case "text":
    case "text-static":
      node.classList.add("txt");
      node.innerHTML = tiptapHtml(e.content);
      // Teks kapital (UNDANGAN PERNIKAHAN, MEMPELAI, ...) memakai batas label; teks lain batas teks isi.
      css += textStyle(e.style, /[A-Z]/.test(node.textContent) && node.textContent === node.textContent.toUpperCase() ? "label" : "body");
      // Semua teks berupa <div>; judul diberi peran heading supaya pembaca layar punya urutan judul.
      if (e.id === "e-cover-names" || e.id.endsWith("-title")) { node.setAttribute("role", "heading"); node.setAttribute("aria-level", e.id === "e-cover-names" ? "1" : "2"); }
      break;
    case "graphic":
      css += `color:${e.tint ?? "#8a9a7b"};`;
      if (e.src.assetId === "asset-arch-outline") { node.classList.add("arch-line"); css += `border-radius:${archRadius(e.width)};`; }
      else if (e.src.assetId === "asset-arch-panel") css += `background:currentColor;border-radius:${archRadius(e.width)};box-shadow:0 ${s(10)} ${s(30)} #3e4a3d14;`;
      else node.innerHTML = SPRIG;
      break;
    case "frame":
    case "photo":
      node.classList.add("photo");
      if (e.type === "frame" && e.mask.assetId === "asset-mask-arch") css += `border-radius:${archRadius(e.width)};`;
      if (DEMO_PHOTOS[e.src.assetId]) {
        node.classList.add("has-img");
        node.dataset.caption = {
          "asset-demo-couple-cover": `${PH.bride_name} & ${PH.groom_name}`,
          "asset-demo-bride": PH.bride_name,
          "asset-demo-groom": PH.groom_name,
        }[e.src.assetId] ?? "";
        node.innerHTML = photoImg(DEMO_PHOTOS[e.src.assetId], e.width * 2.4, e.sectionId === DOC.cover?.sectionId, `Foto ${node.dataset.caption}`.trim());
      } else {
        node.innerHTML = `<span>${e.src.assetId.replace("asset-demo-", "").replace(/-/g, " ")}</span>`;
      }
      break;
    case "rect":
      css += `background:${e.fill};border-radius:${s(e.radius)};${e.border ? `border:${s(e.border.width)} solid ${e.border.color};` : ""}`;
      break;
    case "button":
      node.classList.add("btn");
      css += textStyle(e.style) + `background:${e.fill};font-weight:600;`;
      node.textContent = e.label;
      if (e.action?.kind === "add-to-calendar") Object.assign(node, { href: calendarUrl(), target: "_blank", rel: "noopener" });
      break;
    default:
      node.innerHTML = widget(e);
  }
  node.style.cssText = css;
  // Lengkung, ranting, dan garis hanya hiasan: tidak dibacakan pembaca layar.
  if (e.type === "graphic" || e.type === "rect") node.setAttribute("aria-hidden", "true");
  if (e.animation) {
    const { variant, duration, delay = 0, direction } = e.animation;
    node.dataset.anim = variant;
    if (direction) node.dataset.dir = direction;
    node.style.transitionDuration = `${duration}ms`;
    if (delay) node.style.transitionDelay = `${delay}ms`;
    if (variant === "Typewriter") splitLetters(node, duration, delay);
  }
  return node;
}

/** Typewriter (PLANNING §5.6): huruf jadi <span aria-hidden>; teks utuhnya disimpan tersembunyi untuk pembaca layar. */
function splitLetters(node, duration, delay) {
  const label = node.textContent;
  const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
  const texts = [];
  while (walker.nextNode()) texts.push(walker.currentNode);
  const total = texts.reduce((n, t) => n + t.data.length, 0) || 1;
  let i = 0;
  for (const t of texts) {
    const frag = document.createDocumentFragment();
    // Huruf satu kata dibungkus supaya nama yang panjang turun baris di antara kata, bukan di tengah kata.
    for (const part of t.data.split(/( )/)) {
      if (!part) continue;
      const word = part === " " ? frag : frag.appendChild(Object.assign(document.createElement("span"), { className: "wd" }));
      for (const c of part) {
        const span = document.createElement("span");
        span.className = c === " " ? "ch sp" : "ch";
        span.setAttribute("aria-hidden", "true");
        span.textContent = c === " " ? " " : c;
        span.style.transitionDelay = `${delay + Math.round((i++ * duration) / total)}ms`;
        word.appendChild(span);
      }
    }
    t.replaceWith(frag);
  }
  (node.querySelector("p") ?? node).prepend(Object.assign(document.createElement("span"), { className: "sr", textContent: label }));
}

const elNode = (e) => document.getElementById(`e-${e.id}`);
// Selisih tinggi isi teks dengan kotaknya (px); positif bila teks turun baris melebihi kotak.
function textOverflow(node) {
  let h = 0;
  for (const p of node.children) h += p.offsetHeight;
  return h - node.clientHeight;
}
// Teks bergaya minFontSize (nama mempelai, nama tamu, tanggal) mengecil sampai muat di kotaknya,
// paling kecil minFontSize; baru setelah itu boleh turun baris.
const fitEls = Object.values(DOC.elements).filter((e) => e.style?.minFontSize && elNode(e));
function fitTexts() {
  for (const e of fitEls) {
    const node = elNode(e);
    const overflows = () => textOverflow(node) > 1 || [...node.children].some((p) => p.scrollWidth > p.clientWidth + 1);
    let fs = e.style.fontSize;
    node.style.fontSize = fontSize(fs);
    while (fs > e.style.minFontSize && overflows()) node.style.fontSize = fontSize((fs = Math.max(e.style.minFontSize, fs - 1)));
  }
}

// Lightbox foto
const Lightbox = (() => {
  const icon = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
  const root = document.createElement("div");
  root.className = "lb";
  root.setAttribute("role", "dialog");
  root.setAttribute("aria-modal", "true");
  root.setAttribute("aria-label", "Foto");
  root.innerHTML = `<img alt="" draggable="false">
    <button class="x" type="button" aria-label="Tutup">${icon("M6 6l12 12M18 6L6 18")}</button>
    <button class="prev" type="button" aria-label="Foto sebelumnya">${icon("M15 5l-7 7 7 7")}</button>
    <button class="next" type="button" aria-label="Foto berikutnya">${icon("M9 5l7 7-7 7")}</button>
    <div class="bar"><span class="cap"></span><small class="count"></small></div>`;
  document.body.appendChild(root);
  const img = root.querySelector("img");
  const cap = root.querySelector(".cap");
  const count = root.querySelector(".count");
  const MAX = 4;
  let items = [], index = 0, s = 1, tx = 0, ty = 0, lastFocus = null, lastTap = 0, tapTimer = 0;
  const pointers = new Map();
  let pinch = null, drag = null;

  function apply(anim) {
    img.classList.toggle("anim", !!anim);
    img.style.transform = `translate(-50%,-50%) translate(${tx}px,${ty}px) scale(${s})`;
    root.classList.toggle("zoomed", s > 1);
  }
  function clamp() {
    const mx = Math.max(0, (img.offsetWidth * s - innerWidth) / 2);
    const my = Math.max(0, (img.offsetHeight * s - innerHeight) / 2);
    tx = Math.min(mx, Math.max(-mx, tx));
    ty = Math.min(my, Math.max(-my, ty));
  }
  // Zoom dengan titik (px,py) layar tetap di tempat.
  function zoomAt(next, px, py, anim) {
    next = Math.min(MAX, Math.max(1, next));
    const ox = px - innerWidth / 2, oy = py - innerHeight / 2;
    tx = ox - (ox - tx) * (next / s);
    ty = oy - (oy - ty) * (next / s);
    s = next;
    if (s === 1) tx = ty = 0;
    clamp();
    apply(anim);
  }
  function show(i) {
    index = (i + items.length) % items.length;
    const it = items[index];
    s = 1; tx = ty = 0;
    apply(false);
    img.src = it.src;
    img.alt = it.alt || it.caption;
    if (it.hd) {
      const hi = new Image();
      hi.onload = () => { if (items[index] === it) img.src = it.hd; };
      hi.src = it.hd;
    }
    cap.textContent = it.caption;
    count.textContent = items.length > 1 ? `${index + 1} / ${items.length}` : "";
  }
  function open(list, i) {
    items = list;
    lastFocus = document.activeElement;
    root.classList.add("open");
    document.documentElement.style.overflow = "hidden";
    if (!lbHist) { history.pushState({ lb: 1 }, ""); lbHist = true; }
    show(i);
    root.querySelector(".x").focus({ preventScroll: true });
  }
  function close() {
    root.classList.remove("open");
    document.documentElement.style.overflow = "";
    pointers.clear();
    pinch = drag = null;
    lastFocus?.focus?.({ preventScroll: true });
    if (lbHist) { lbHist = false; history.back(); }
  }
  // Tombol Back (Android/browser) menutup foto dulu, bukan meninggalkan undangan.
  let lbHist = false;
  addEventListener("popstate", () => { if (lbHist) { lbHist = false; close(); } });

  root.querySelector(".x").onclick = close;
  root.querySelector(".prev").onclick = () => show(index - 1);
  root.querySelector(".next").onclick = () => show(index + 1);
  document.addEventListener("keydown", (e) => {
    if (!root.classList.contains("open")) return;
    if (e.key === "Escape") close();
    else if (e.key === "Tab") trapTab(e, root);
    else if (e.key === "ArrowLeft") show(index - 1);
    else if (e.key === "ArrowRight") show(index + 1);
  });
  root.addEventListener("wheel", (e) => {
    e.preventDefault();
    zoomAt(s * Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
  }, { passive: false });
  img.addEventListener("dblclick", (e) => e.preventDefault());

  root.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button")) return;
    try { root.setPointerCapture(e.pointerId); } catch {}
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
      drag = null;
    } else if (pointers.size === 1) {
      drag = { x: e.clientX, y: e.clientY, tx, ty, moved: false };
    }
  });
  root.addEventListener("pointermove", (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pointers.size >= 2) {
      const [a, b] = [...pointers.values()];
      zoomAt(pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, pinch.mx, pinch.my);
    } else if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 8) drag.moved = true;
      if (s > 1) { tx = drag.tx + dx; ty = drag.ty + dy; clamp(); }
      else { tx = dx; ty = Math.max(0, dy); }
      apply(false);
    }
  });
  function end(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pinch) {
      if (pointers.size < 2) pinch = null;
      if (pointers.size === 1) { const [p] = pointers.values(); drag = { x: p.x, y: p.y, tx, ty, moved: true }; }
      return;
    }
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    const moved = drag.moved;
    drag = null;
    if (moved) {
      if (s === 1) {
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) show(index + (dx < 0 ? 1 : -1));
        else if (dy > 100) close();
        else { tx = ty = 0; apply(true); }
      }
      return;
    }
    // Ketuk dua kali: zoom 2,5× di titik ketukan / kembali normal. Ketuk sekali di latar: tutup.
    const now = Date.now();
    clearTimeout(tapTimer);
    if (now - lastTap < 300) {
      lastTap = 0;
      zoomAt(s > 1 ? 1 : 2.5, e.clientX, e.clientY, true);
    } else {
      lastTap = now;
      const onBackdrop = e.target === root;
      tapTimer = setTimeout(() => { if (onBackdrop && s === 1) close(); }, 300);
    }
  }
  root.addEventListener("pointerup", end);
  root.addEventListener("pointercancel", end);
  return { open };
})();

for (const form of document.querySelectorAll("form[data-form]")) {
  const def = DOC.forms[form.dataset.form];
  const sys = (k) => def.fields.find((f) => f.system === k);
  const err = form.querySelector(".err");
  const key = `sage-rsvp-${def.id}`;
  // "Tidak hadir" (pilihan kedua) menyembunyikan isian jumlah tamu dan melewati validasinya.
  const att = form.elements[sys("attendance").id], paxLabel = form.elements[sys("pax").id].closest("label");
  const syncPax = () => { paxLabel.hidden = att.selectedIndex === 1; };
  att.addEventListener("change", syncPax);
  const thanks = [
    (r) => `${r.name}, kami menantikan kehadiran Anda (${r.pax} orang).`,
    (r) => `${r.name}, terima kasih atas kabarnya. Doa Anda sangat berarti bagi kami.`,
    (r) => `${r.name}, semoga Anda dapat hadir. Kabari kami lagi, ya.`,
  ];
  const show = (data) => {
    form.classList.toggle("sent", !!data);
    if (!data) return;
    const r = { name: data[sys("name").id], pax: data[sys("pax").id] };
    const i = sys("attendance").options.indexOf(data[sys("attendance").id]);
    form.querySelector(".done p").textContent = thanks[Math.max(0, i)](r);
  };
  // Aturan isian dari definisi formulir: wajib, panjang maksimum, rentang angka.
  const problemOf = (f, v) => {
    const { min = 1, max = 20, maxLength } = f.validation ?? {};
    if (f.required && !v) return `Mohon isi ${f.label.toLowerCase()}.`;
    if (maxLength && v.length > maxLength) return `${f.label} paling banyak ${maxLength} karakter.`;
    if (f.type === "number" && v && !(Number.isInteger(+v) && +v >= min && +v <= max)) return `${f.label} antara ${min} dan ${max}.`;
    return "";
  };
  form.addEventListener("submit", (ev) => {
    ev.preventDefault();
    const data = Object.fromEntries([...new FormData(form)].map(([k, v]) => [k, String(v).trim()]));
    const bad = def.fields.find((f) => !(f.system === "pax" && paxLabel.hidden) && problemOf(f, data[f.id] ?? ""));
    err.hidden = !bad;
    if (bad) { err.textContent = problemOf(bad, data[bad.id] ?? ""); form.elements[bad.id].focus(); return; }
    store.set(key, data);
    show(data);
  });
  form.querySelector(".done button").addEventListener("click", () => { show(null); form.querySelector("input,select,textarea")?.focus(); });
  const saved = store.get(key, null);
  if (saved) {
    for (const [k, v] of Object.entries(saved)) if (form.elements[k]) form.elements[k].value = v;
    show(saved);
  }
  syncPax();
}

const open = document.createElement("button");
open.className = "open-btn";
open.style.cssText = textStyle(cover.buttonStyle) + `background:${cover.buttonFill};font-weight:600;`;
open.innerHTML = `<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>${esc(cover.buttonLabel)}`;
open.onclick = () => {
  document.body.classList.remove("locked");
  open.classList.add("gone");
  coverNode.nextElementSibling?.scrollIntoView({ behavior: "smooth" });
  if (DOC.music) {
    musicBtn.classList.add("show");
    if (DOC.music.autoplayOnOpen) toggleMusic(true);
  }
};
coverNode.appendChild(open);

/*
 * Tata letak sampul: tombol tepat di bawah nama tamu. Bila sampul lebih tinggi dari layar, lengkung,
 * foto, dan ranting diperkecil dari atas lalu teks di bawahnya ikut naik, supaya nama dan tombol
 * terlihat tanpa menggulir. Di layar yang terlalu pendek sampul tetap bisa digulir.
 */
const COVER_MIN_SCALE = 0.4;
const coverEls = DOC.sections[cover.sectionId].elementOrderIds.map((id) => DOC.elements[id]);
const coverTextTop = Math.min(...coverEls.filter((e) => e.type.startsWith("text")).map((e) => e.y));
const coverArt = coverEls.filter((e) => e.y + e.height <= coverTextTop);
const coverText = coverEls.filter((e) => !coverArt.includes(e)).sort((a, b) => a.y - b.y);
const coverArtBottom = Math.max(...coverArt.map((e) => e.y + e.height));
// Tinggi layar tanpa bilah alamat (100svh): stabil saat bilah alamat HP muncul/hilang.
const svhProbe = document.createElement("div");
svhProbe.style.cssText = "position:fixed;top:0;left:0;width:0;height:100vh;height:100svh;visibility:hidden;pointer-events:none";
document.body.appendChild(svhProbe);
function layoutCover() {
  const W = DOC.canvas.baseWidth, unit = canvas.clientWidth / W;
  // Teks yang meluap mendorong elemen di bawahnya.
  let push = 0, bottom = 0;
  const textY = new Map();
  for (const e of coverText) {
    textY.set(e, e.y + push);
    if (elNode(e).classList.contains("txt")) push += Math.max(0, textOverflow(elNode(e)) / unit);
    bottom = Math.max(bottom, e.y + e.height + push);
  }
  const height = DOC.sections[cover.sectionId].height + push;
  const k = Math.max(COVER_MIN_SCALE, Math.min(1, 1 - (height - svhProbe.offsetHeight / unit) / coverArtBottom));
  const lift = coverArtBottom * (1 - k);
  for (const e of coverArt) {
    const mid = e.x + e.width / 2;
    const ax = mid < W / 3 ? e.x : mid > (W * 2) / 3 ? e.x + e.width : W / 2;
    const node = elNode(e);
    node.style.left = s(ax + (e.x - ax) * k);
    node.style.top = s(e.y * k);
    node.style.width = s(e.width * k);
    node.style.height = s(e.height * k);
    if (node.style.borderRadius) node.style.borderRadius = archRadius(e.width * k);
  }
  for (const e of coverText) elNode(e).style.top = s(textY.get(e) - lift);
  coverNode.style.setProperty("--btn-y", bottom + 16 - lift);
  coverNode.style.setProperty("--h", height - lift);
}
/*
 * Bagian lain: teks atau widget yang meluap dari kotaknya (huruf minimum di layar sempit, nama
 * panjang) mendorong elemen di bawahnya turun, dan elemen yang membingkainya (lengkung, kartu)
 * ikut memanjang. Tanpa luapan, posisi dan ukuran tetap seperti di data.
 */
function layoutSections() {
  const unit = canvas.clientWidth / DOC.canvas.baseWidth;
  for (const id of DOC.sectionOrderIds) {
    const sec = DOC.sections[id];
    if (sec.hidden || id === cover.sectionId) continue;
    const els = sec.elementOrderIds.map((i) => DOC.elements[i]);
    for (const e of els) Object.assign(elNode(e).style, { top: s(e.y), height: s(e.height) });
    const shift = new Map(), grow = new Map();
    let total = 0;
    for (const t of els) {
      const node = elNode(t);
      const over = (node.classList.contains("txt") ? textOverflow(node) : node.scrollHeight - node.clientHeight) / unit;
      if (over <= 1) continue;
      total += over;
      for (const e of els) {
        if (e === t) continue;
        if (e.y >= t.y + t.height - 1) shift.set(e, (shift.get(e) ?? 0) + over);
        else if (e.y <= t.y && e.y + e.height >= t.y + t.height && !elNode(e).classList.contains("txt")) grow.set(e, (grow.get(e) ?? 0) + over);
      }
    }
    for (const e of els) Object.assign(elNode(e).style, { top: s(e.y + (shift.get(e) ?? 0)), height: s(e.height + (grow.get(e) ?? 0)) });
    document.getElementById(`s-${id}`).style.setProperty("--h", sec.height + total);
  }
}
function relayout() {
  fitTexts();
  layoutCover();
  layoutSections();
}
relayout();
let layoutRaf = 0;
addEventListener("resize", () => { cancelAnimationFrame(layoutRaf); layoutRaf = requestAnimationFrame(relayout); });
document.fonts?.ready.then(relayout);
// Font dimuat dari berkas terpisah; font yang baru dipakai belakangan (mis. Lora miring) memicu hitung ulang juga.
document.fonts?.addEventListener?.("loadingdone", relayout);

/*
 * Musik latar. Aset `doc.music` belum ada, jadi preview memakai instrumental piano buatan sendiri:
 * progresi F–C–Dm–B♭, arpeggio + melodi lonceng, reverb. Nada dirender sekali lewat
 * OfflineAudioContext menjadi WAV, lalu diputar lewat <audio loop>. Web Audio langsung
 * dibisukan iPhone saat tombol senyap aktif, elemen <audio> tidak.
 */
const Music = (() => {
  const BEAT = 60 / 68 / 2; // seperdelapan pada 68 bpm
  const CHORDS = [[53, 57, 60, 65], [48, 55, 60, 64], [50, 57, 62, 65], [46, 53, 58, 62]];
  const MELODY = [
    [[72, null, 69, 70], [72, null, 67, null], [69, 70, 72, 74], [77, null, 74, 72]],
    [[77, 76, 74, 72], [76, null, 72, null], [74, 72, 69, 72], [70, null, 69, null]],
  ];
  const ARP = [0, 1, 2, 3, 2, 1, 2, 3];
  const LOOP_STEPS = 64; // 2 variasi × 4 birama × 8 seperdelapan
  const LOOP_SEC = LOOP_STEPS * BEAT;
  const RATE = 22050;
  const hz = (m) => 440 * 2 ** ((m - 69) / 12);

  const audio = new Audio();
  audio.loop = true;
  audio.preload = "auto";
  audio.setAttribute("playsinline", "");
  let url = null, wanted = false, unlocked = false, rendered = null;

  // WAV hening 0,1 detik untuk "membuka kunci" elemen audio di dalam gesture klik.
  const SILENT = wavUrl([new Float32Array(2205)], RATE);

  function wavUrl(channels, rate) {
    const n = channels[0].length, ch = channels.length;
    const view = new DataView(new ArrayBuffer(44 + n * ch * 2));
    const str = (o, s) => [...s].forEach((c, i) => view.setUint8(o + i, c.charCodeAt(0)));
    str(0, "RIFF"); view.setUint32(4, 36 + n * ch * 2, true); str(8, "WAVEfmt ");
    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, ch, true);
    view.setUint32(24, rate, true); view.setUint32(28, rate * ch * 2, true);
    view.setUint16(32, ch * 2, true); view.setUint16(34, 16, true);
    str(36, "data"); view.setUint32(40, n * ch * 2, true);
    let o = 44;
    for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) {
      const v = Math.max(-1, Math.min(1, channels[c][i]));
      view.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7fff, true);
      o += 2;
    }
    return URL.createObjectURL(new Blob([view], { type: "audio/wav" }));
  }

  // Render dua putaran lalu ambil putaran kedua: ekor reverb putaran pertama ikut di awal,
  // sehingga sambungan loop mulus.
  async function render() {
    const Offline = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const ctx = new Offline(2, Math.ceil(RATE * LOOP_SEC * 2), RATE);
    const tone = ctx.createBiquadFilter();
    tone.type = "lowpass";
    tone.frequency.value = 3200;
    const dry = ctx.createGain();
    const wet = ctx.createGain();
    wet.gain.value = 0.38;
    const verb = ctx.createConvolver();
    const ir = ctx.createBuffer(2, RATE * 2.8, RATE);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 3;
    }
    verb.buffer = ir;
    const out = ctx.createGain();
    out.gain.value = 0.55;
    dry.connect(tone);
    wet.connect(verb).connect(tone);
    tone.connect(out).connect(ctx.destination);

    // Nada piano/lonceng: fundamental sine + harmonik, envelope peluruhan eksponensial.
    const note = (midi, t, gain, decay, bright) => {
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
      g.connect(dry);
      g.connect(wet);
      [[1, 1, "sine"], [2, 0.35 * bright, "triangle"], [3, 0.12 * bright, "sine"]].forEach(([mul, amp, type]) => {
        const o = ctx.createOscillator();
        const og = ctx.createGain();
        o.type = type;
        o.frequency.value = hz(midi) * mul;
        og.gain.value = amp;
        o.connect(og).connect(g);
        o.start(t);
        o.stop(t + decay + 0.05);
      });
    };
    for (let step = 0; step < LOOP_STEPS * 2; step++) {
      const t = step * BEAT;
      const bar = Math.floor(step / 8) % 4;
      const pos = step % 8;
      const chord = CHORDS[bar];
      if (pos === 0) note(chord[0] - 12, t, 0.16, 3.2, 0.6);
      note(chord[ARP[pos]], t, 0.07, 1.6, 0.8);
      const m = pos % 2 === 0 && MELODY[Math.floor(step / 32) % 2][bar][pos / 2];
      if (m) note(m, t + 0.01, 0.13, 2.2, 0.5);
    }
    // Render dipecah per detik audio. Tanpa ini browser menahan pemuatan ulang atau perpindahan halaman sampai render selesai.
    if (typeof ctx.suspend === "function") for (let x = 1; x < ctx.length / ctx.sampleRate; x++) ctx.suspend(x).then(() => ctx.resume(), () => {});
    const buf = await new Promise((resolve, reject) => {
      ctx.oncomplete = (e) => resolve(e.renderedBuffer);
      const p = ctx.startRendering();
      if (p && p.catch) p.catch(reject);
    });
    const start = Math.round(RATE * LOOP_SEC);
    const len = Math.round(RATE * LOOP_SEC);
    const chans = [0, 1].map((c) => buf.getChannelData(c).slice(start, start + len));
    let sum = 0, peak = 0;
    for (const x of chans[0]) { sum += x * x; peak = Math.max(peak, Math.abs(x)); }
    rendered = { seconds: LOOP_SEC, rms: Math.sqrt(sum / len), peak };
    return wavUrl(chans, RATE);
  }

  const ready = render().then((u) => {
    url = u;
    if (unlocked) {
      audio.src = url;
      if (wanted) audio.play().catch(() => {});
    }
  });

  return {
    ready,
    get playing() { return wanted; },
    get loaded() { return !!url; },
    get audio() { return audio; },
    get rendered() { return rendered; },
    // Wajib dipanggil langsung dari handler klik supaya iOS mengizinkan pemutaran.
    play() {
      wanted = true;
      if (!unlocked) {
        unlocked = true;
        audio.src = url || SILENT;
      }
      audio.play().catch(() => {});
    },
    pause() {
      wanted = false;
      audio.pause();
    },
  };
})();

const musicBtn = document.createElement("button");
musicBtn.className = "music-btn";
musicBtn.setAttribute("aria-label", "Putar/jeda musik");
musicBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>`;
document.body.appendChild(musicBtn);
let wantMusic = false;
function toggleMusic(on = !Music.playing) {
  wantMusic = on;
  on ? Music.play() : Music.pause();
  musicBtn.classList.toggle("playing", on);
  musicBtn.setAttribute("aria-pressed", String(on));
  setMusicBusy(on && !Music.loaded);
}
// Nada dirender beberapa detik setelah halaman dibuka; sampai siap, tombol menandai "memuat".
function setMusicBusy(busy) {
  musicBtn.classList.toggle("loading", busy);
  busy ? musicBtn.setAttribute("aria-busy", "true") : musicBtn.removeAttribute("aria-busy");
}
Music.ready.then(() => setMusicBusy(false), () => setMusicBusy(false));
musicBtn.onclick = () => toggleMusic();
// Jeda saat tab disembunyikan, lanjut lagi saat kembali.
document.addEventListener("visibilitychange", () => {
  if (!wantMusic) return;
  document.hidden ? Music.audio.pause() : Music.audio.play().catch(() => {});
});
window.__music = Music;

// Animasi masuk
const io = new IntersectionObserver((entries) => {
  for (const en of entries) if (en.isIntersecting) { en.target.classList.add("is-visible"); io.unobserve(en.target); }
}, { threshold: 0.15 });
document.querySelectorAll("[data-anim]").forEach((n) => io.observe(n));

// Countdown
// Setelah acara dimulai, hitung mundur (yang membeku di 00) diganti pesan.
const EVENT_END = Math.max(...Object.values(EVENT.events).map((ev) => +new Date(ev.endsAt ?? ev.startsAt)));
function tick() {
  for (const n of document.querySelectorAll("[data-countdown]")) {
    let d = Math.max(0, Math.floor((new Date(n.dataset.countdown) - Date.now()) / 1000));
    if (!d) {
      const msg = Date.now() < EVENT_END ? "Hari bahagia telah tiba. Terima kasih atas doa dan kehadiran Anda." : "Acara telah berlangsung. Terima kasih atas doa dan restu Anda.";
      if (n.dataset.msg !== msg) { n.dataset.msg = msg; n.classList.add("over"); n.innerHTML = `<p>${msg}</p>`; }
      continue;
    }
    const parts = [Math.floor(d / 86400), Math.floor(d / 3600) % 24, Math.floor(d / 60) % 60, d % 60];
    n.querySelectorAll("b").forEach((b, i) => (b.textContent = String(parts[i]).padStart(2, "0")));
  }
}
tick();
setInterval(tick, 1000);
if (new URLSearchParams(location.search).has("open")) open.click();

/* ---------- Tombol musik menepi selama ada kontrol di bawahnya ---------- */
/* Setelah halaman berhenti digulir, tombol musik disembunyikan bila ada isian, pilihan, tombol, tautan, atau foto
   di bawahnya, supaya ketukan di tepi kanan tidak tertangkap tombol musik. Muncul lagi begitu halaman digulir menjauh. */
{
  let idle = 0;
  const CONTROL = "a[href],button,input,select,textarea,summary,[role=button],[tabindex]:not([tabindex='-1'])";
  // Label dihitung hanya bila terhubung ke isian; label judul seperti "Kehadiran" tidak bisa diketuk.
  const isControl = (el) => !!(el.closest(CONTROL) || el.closest("label")?.control);
  const covers = () => {
    const w = musicBtn.offsetWidth, h = musicBtn.offsetHeight;
    if (!w || !musicBtn.isConnected) return false;
    const cs = getComputedStyle(musicBtn), de = document.documentElement;
    const x0 = de.clientWidth - parseFloat(cs.right) - w, y0 = de.clientHeight - parseFloat(cs.bottom) - h;
    for (const fx of [.15, .5, .85]) for (const fy of [.15, .5, .85]) {
      for (const el of document.elementsFromPoint(x0 + w * fx, y0 + h * fy)) {
        if (musicBtn.contains(el)) continue;
        if (isControl(el)) return true;
        break;
      }
    }
    return false;
  };
  const settle = () => musicBtn.classList.toggle("dodge", document.activeElement !== musicBtn && covers());
  for (const ev of ["scroll", "resize", "input", "change", "click"]) addEventListener(ev, () => { clearTimeout(idle); idle = setTimeout(settle, ev === "scroll" ? 150 : 300); }, { passive: true });
}
</script>
</body>
